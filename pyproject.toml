[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mixerm8"
version = "0.1.0"
description = "Local bridge for MixerM8."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ryan Moore" }]
keywords = ["mixerm8", "bridge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://rwm6857.github.io/mixerm8/"
Source = "https://github.com/rwm6857/mixerm8"
Issues = "https://github.com/rwm6857/mixerm8/issues"

[project.scripts]
mixerm8 = "mixerm8.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mixerm8"]

[tool.hatch.build.targets.sdist]
# The Pages site and content are not part of the Python release.
include = ["src/mixerm8", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
