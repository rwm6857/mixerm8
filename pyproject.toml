[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mixerm8"
version = "0.1.0"
description = "Read-only bridge between a Behringer X32 and a booth tablet guide."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ryan Moore" }]
keywords = ["x32", "behringer", "osc", "audio", "church", "sound"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]

# Deliberately empty. The bridge is Python standard library only, so
# `pip install mixerm8` pulls in nothing else and the frozen .exe stays small.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://rwm6857.github.io/mixerm8/"
Source = "https://github.com/rwm6857/mixerm8"
Issues = "https://github.com/rwm6857/mixerm8/issues"

[project.scripts]
mixerm8 = "mixerm8.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mixerm8"]

# The tablet app is one set of files with two delivery paths: GitHub Pages
# serves docs/ directly, and the wheel carries the same files so the bridge
# can serve them on a LAN with no internet. Single source, no duplication.
[tool.hatch.build.targets.wheel.force-include]
"docs" = "mixerm8/webroot"
# The editor is not under docs/ on purpose: docs/ is published to GitHub
# Pages, and an editor served from a static host is a Save button with
# nothing behind it. It still ships, so the booth machine can reword its
# own copy without a checkout.
"editor" = "mixerm8/editorroot"

[tool.hatch.build.targets.sdist]
include = ["src/mixerm8", "docs", "editor", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
