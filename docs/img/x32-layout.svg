<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img"
     aria-label="A rough map of the mixing desk: channel faders and their select buttons on the left, the screen and its tab buttons in the middle, and the main fader on the right.">
  <style>
    .desk  { fill: #171a20; stroke: #333a46; stroke-width: 1.5; }
    .zone  { fill: #1e222a; stroke: #3d4552; stroke-width: 1.5; }
    .live  { fill: #1e222a; stroke: #4bbf7b; stroke-width: 2; }
    .cap   { fill: #f2f4f7; font: 600 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sub   { fill: #98a1b0; font: 400 10.5px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .knob  { fill: #98a1b0; }
    .strip { stroke: #4a5262; stroke-width: 2; stroke-linecap: round; }
    .lead  { stroke: #59616f; stroke-width: 1.2; fill: none; }
  </style>

  <rect class="desk" x="8" y="52" width="404" height="196" rx="12"/>

  <!-- Screen and its tab buttons -->
  <rect class="zone" x="196" y="72" width="132" height="80" rx="6"/>
  <text class="sub" x="207" y="98">the screen</text>
  <text class="sub" x="207" y="114">tells you where</text>
  <text class="sub" x="207" y="130">you are</text>
  <g class="knob">
    <rect x="196" y="160" width="26" height="14" rx="3"/>
    <rect x="228" y="160" width="26" height="14" rx="3"/>
    <rect x="260" y="160" width="26" height="14" rx="3"/>
    <rect x="292" y="160" width="26" height="14" rx="3"/>
  </g>
  <path class="lead" d="M300 68 L300 44"/>
  <text class="cap" x="412" y="20" text-anchor="end">Screen and its tab buttons</text>
  <text class="sub" x="412" y="35" text-anchor="end">the tabs pick what it shows</text>

  <!-- Select buttons -->
  <g class="knob">
    <rect x="26" y="92" width="17" height="13" rx="3"/>
    <rect x="49" y="92" width="17" height="13" rx="3"/>
    <rect x="72" y="92" width="17" height="13" rx="3"/>
    <rect x="95" y="92" width="17" height="13" rx="3"/>
    <rect x="118" y="92" width="17" height="13" rx="3"/>
    <rect x="141" y="92" width="17" height="13" rx="3"/>
  </g>
  <path class="lead" d="M92 90 L92 44"/>
  <text class="cap" x="16" y="20">Select buttons</text>
  <text class="sub" x="16" y="35">pick which channel the screen is about</text>

  <!-- Channel faders -->
  <rect class="live" x="16" y="118" width="152" height="112" rx="6"/>
  <g class="strip">
    <path d="M34 132 L34 216"/><path d="M57 132 L57 216"/><path d="M80 132 L80 216"/>
    <path d="M103 132 L103 216"/><path d="M126 132 L126 216"/><path d="M149 132 L149 216"/>
  </g>
  <g class="knob">
    <rect x="27" y="176" width="14" height="10" rx="2"/>
    <rect x="50" y="166" width="14" height="10" rx="2"/>
    <rect x="73" y="184" width="14" height="10" rx="2"/>
    <rect x="96" y="170" width="14" height="10" rx="2"/>
    <rect x="119" y="192" width="14" height="10" rx="2"/>
    <rect x="142" y="174" width="14" height="10" rx="2"/>
  </g>
  <path class="lead" d="M92 232 L92 258"/>
  <text class="cap" x="16" y="274">Channel faders</text>
  <text class="sub" x="16" y="290">one per microphone — how loud it is in the room</text>

  <!-- Main fader -->
  <rect class="live" x="348" y="118" width="52" height="112" rx="6"/>
  <path class="strip" d="M374 132 L374 216"/>
  <rect class="knob" x="367" y="160" width="14" height="10" rx="2"/>
  <path class="lead" d="M374 232 L374 258"/>
  <text class="cap" x="306" y="274">Main fader</text>
  <text class="sub" x="306" y="290">everything at once</text>
</svg>
