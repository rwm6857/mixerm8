<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>MixerM8 — Sunday Guide</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="bar">
  <div class="brand">
    <button id="back" class="homebtn" type="button" hidden aria-label="Back to the station list">←</button>
    <span class="mark" aria-hidden="true"></span>
    <span id="brand-text">MixerM8</span>
  </div>
  <div class="bar-right">
    <!-- Language is a flip, not a menu: one segment per language the guide
         declares, always in the same place on every view, so switching is
         one deliberate tap. Hidden when only one language is declared. -->
    <div id="langs" class="langs" role="group" aria-label="Language"></div>
    <span id="status" class="status" data-state="idle">
      <span class="dot" aria-hidden="true"></span><span id="status-text">Starting</span>
    </span>
  </div>
</header>

<nav class="tabs" id="tabs" role="tablist" hidden></nav>

<main>
  <!-- Station picker: the bare URL, and the tablet's home screen -->
  <section id="view-pick" class="view">
    <div id="hero" class="hero"></div>
    <p class="lede" id="pick-lede">Which station are you on today?</p>
    <div id="pick" class="pick"></div>
  </section>

  <!-- A station's own front page: what this job is, where to go, and the
       questions people actually ask. Static, so it works with the bridge dead. -->
  <section id="view-home" class="view" hidden>
    <div id="home-intro"></div>
    <div id="home-nav" class="homenav"></div>
    <div id="home-faq"></div>
  </section>

  <!-- Before the service -->
  <section id="view-checklist" class="view" hidden>
    <p class="lede" id="checklist-lede"></p>
    <ol id="checklist" class="checklist"></ol>
    <button id="reset" class="chip wide" type="button">Clear the ticks</button>
  </section>

  <!-- Something is wrong -->
  <section id="view-problems" class="view" hidden>
    <p class="lede" id="problems-lede"></p>
    <div id="problems" class="grid"></div>
    <div id="problem-detail"></div>
  </section>

  <!-- Running order -->
  <section id="view-flow" class="view" hidden>
    <p class="lede" id="flow-lede"></p>
    <button id="expand" class="chip" type="button"></button>
    <ol id="flow" class="flow"></ol>
  </section>

  <!-- The gear at this station, and what each box does -->
  <section id="view-equipment" class="view" hidden>
    <p class="lede" id="equipment-lede"></p>
    <div id="equipment" class="grid"></div>
    <div id="equipment-detail"></div>
  </section>

  <!-- Training and reference: the free-form layer, all blocks -->
  <section id="view-pages" class="view" hidden>
    <p class="lede" id="pages-lede"></p>
    <div id="pages" class="grid"></div>
    <div id="pages-detail"></div>
  </section>

  <!-- Follows the mixer. Only the follow row needs a bridge. -->
  <section id="view-now" class="view" hidden>
    <div class="follow-row">
      <label class="switch">
        <input id="follow" type="checkbox" checked>
        <span class="track" aria-hidden="true"><span class="knob"></span></span>
        <span class="switch-label" id="follow-label">Follow the mixer</span>
      </label>
      <span id="where" class="where"></span>
    </div>
    <div id="now"></div>
    <div id="screens" class="grid"></div>
  </section>
</main>

<footer id="foot"></footer>

<script src="app.js"></script>
</body>
</html>
