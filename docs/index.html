<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>MixerM8 — Sunday Guide</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="bar">
  <div class="brand">
    <button id="home" class="homebtn" type="button" hidden aria-label="Back to the station list">←</button>
    <span class="mark" aria-hidden="true"></span>
    <span id="brand-text">MixerM8</span>
  </div>
  <div class="bar-right">
    <button id="lang" class="chip" type="button" aria-label="Language">EN</button>
    <span id="status" class="status" data-state="idle">
      <span class="dot" aria-hidden="true"></span><span id="status-text">Starting</span>
    </span>
  </div>
</header>

<nav class="tabs" id="tabs" role="tablist" hidden></nav>

<main>
  <!-- Station picker: the bare URL, and the tablet's home screen -->
  <section id="view-pick" class="view">
    <p class="lede" id="pick-lede">Which station are you on today?</p>
    <div id="pick" class="pick"></div>
  </section>

  <!-- Before the service -->
  <section id="view-checklist" class="view" hidden>
    <p class="lede" id="checklist-lede"></p>
    <ol id="checklist" class="checklist"></ol>
    <button id="reset" class="chip wide" type="button">Clear the ticks</button>
  </section>

  <!-- Something is wrong -->
  <section id="view-problems" class="view" hidden>
    <p class="lede" id="problems-lede"></p>
    <div id="problems" class="grid"></div>
    <div id="problem-detail"></div>
  </section>

  <!-- Running order -->
  <section id="view-flow" class="view" hidden>
    <p class="lede" id="flow-lede"></p>
    <ol id="flow" class="flow"></ol>
  </section>

  <!-- Follows the mixer. Only exists when a bridge answered. -->
  <section id="view-now" class="view" hidden>
    <div class="follow-row">
      <label class="switch">
        <input id="follow" type="checkbox" checked>
        <span class="track" aria-hidden="true"><span class="knob"></span></span>
        <span class="switch-label">Follow the mixer</span>
      </label>
      <span id="where" class="where"></span>
    </div>
    <div id="now"></div>
    <div id="screens" class="grid"></div>
  </section>
</main>

<footer id="foot"></footer>

<script src="app.js"></script>
</body>
</html>
