<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>MixerM8 — Booth Guide</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="bar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <span>MixerM8</span>
  </div>
  <div class="bar-right">
    <button id="lang" class="chip" type="button" aria-label="Language">EN</button>
    <span id="status" class="status" data-state="idle">
      <span class="dot" aria-hidden="true"></span><span id="status-text">Starting</span>
    </span>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab" data-view="now"    role="tab" aria-selected="true">Now</button>
  <button class="tab" data-view="guides" role="tab" aria-selected="false">Guides</button>
  <button class="tab" data-view="flow"   role="tab" aria-selected="false">Service</button>
</nav>

<main>
  <!-- Follow view -->
  <section id="view-now" class="view">
    <div class="follow-row">
      <label class="switch">
        <input id="follow" type="checkbox" checked>
        <span class="track" aria-hidden="true"><span class="knob"></span></span>
        <span class="switch-label">Follow the mixer</span>
      </label>
      <span id="where" class="where"></span>
    </div>
    <div id="now"></div>
  </section>

  <!-- All guides -->
  <section id="view-guides" class="view" hidden>
    <p class="lede">Every screen on the desk, and what it does. Tap one to read it.</p>
    <div id="guides" class="grid"></div>
  </section>

  <!-- Service flow -->
  <section id="view-flow" class="view" hidden>
    <p class="lede">The order of a normal Sunday.</p>
    <ol id="flow" class="flow"></ol>
  </section>
</main>

<footer id="foot"></footer>

<script src="app.js"></script>
</body>
</html>
